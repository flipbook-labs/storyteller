[package]
name = "flipbook-labs/storyteller"
version = "1.13.0"
license = "MIT"
registry = "https://github.com/UpliftGames/wally-index"
realm = "shared"
include = [
	"dist",
	"dist/**/*",
	"LICENSE",
	"README.md",
	"default.project.json",
	"wally.toml",
]
exclude = ["*"]

[dependencies]
Archivist = "flipbook-labs/archivist@0.3.1"
Charm = "littensy/charm@0.11.0-rc.4"
GreenTea = "corecii/greentea@0.4.11"
ModuleLoader = "flipbook-labs/module-loader@0.13.0"
React = "jsdotlua/react@17.0.2"
ReactCharm = "littensy/react-charm@0.4.0-rc.3"
Sift = "csqrl/sift@0.0.8"
t = "osyrisrblx/t@3.0.0"
UILabs = "pepeeltoro41/ui-labs@2.4.2"

# [dev-dependencies]
Fusion = "elttob/fusion@0.2.0"
Fusion3 = "elttob/fusion@0.3.0"
Iris = "sirmallard/iris@2.5.1"
Jest = "roblox/jest@3.21.0"
JestGlobals = "roblox/jest-globals@3.21.0"
ReactRoblox = "jsdotlua/react-roblox@17.0.2"
Roact = "roblox/roact@1.4.4"
RoactCompat = "jsdotlua/roact-compat@17.0.2"
Vide = "centau/vide@0.4.0"
